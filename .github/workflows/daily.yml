name: AI Price Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "15 8 * * *"
      timezone: "Europe/Lisbon"

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar AI Price Radar
        env:
          # Nombres de secret tal como están creados en este repo (Settings > Secrets and variables > Actions).
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER }}
          OPENROUTER_MANAGEMENT_API_KEY: ${{ secrets.OPENROUTER_MANAGEMENT_API_KEY }}
          CHEAPER_INFERENCE_API_KEY: ${{ secrets.CHEAPERINFERENCE }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHERAI }}
          NOVITA_API_KEY: ${{ secrets.NOVIA_AI }}
        run: python src/main.py

      - name: Guardar informe
        run: |
          git config user.name "ai-price-radar[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add data reports
          git diff --cached --quiet || git commit -m "chore: daily AI price report"
          git push
